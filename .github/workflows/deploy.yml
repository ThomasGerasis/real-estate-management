name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # Fixed "real-estate" name (not the repo name) so it matches the
        # image reference hardcoded in deploy/prod.docker-compose.yml.
        # Owner is lowercased since GHCR requires lowercase repository names.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/real-estate" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/prod.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/real-estate

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export REGISTRY=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=${{ github.sha }}

            docker compose \
              --env-file deploy/prod.env \
              -f deploy/prod.docker-compose.yml \
              pull app queue scheduler

            docker compose \
              --env-file deploy/prod.env \
              -f deploy/prod.docker-compose.yml \
              run --rm app php artisan migrate --force

            docker compose \
              --env-file deploy/prod.env \
              -f deploy/prod.docker-compose.yml \
              up -d --no-deps --remove-orphans app queue scheduler

            docker image prune -f

            echo "✅ Deployed ${{ github.sha }} successfully"
